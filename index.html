<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FF8CC6">
<title>Belle and Leah's Perfect Game</title>
<style>
:root{
  --pink:#FF8CC6; --pink-d:#E0478F; --pink-l:#FFE3F1;
  --blue:#6EC1FF; --blue-d:#3A8FD6; --blue-l:#DDF1FF;
  --ink:#5A2A5E;
  --font:"Comic Sans MS","Chalkboard SE","Comic Neue","Trebuchet MS",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--pink-l);font-family:var(--font);color:var(--ink);
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.active{display:flex}
button{font-family:inherit;border:none;cursor:pointer;touch-action:manipulation;color:inherit}

.bigbtn{background:linear-gradient(#FFA9D4,#FF6FB5);color:#fff;font-size:26px;font-weight:bold;padding:16px 28px;border-radius:999px;
  box-shadow:0 6px 0 #D9488D,0 10px 18px rgba(200,60,140,.25);text-shadow:0 2px 0 rgba(0,0,0,.12)}
.bigbtn.blue{background:linear-gradient(#A8DDFF,#5CB8FF);box-shadow:0 6px 0 #3A8FD6,0 10px 18px rgba(60,140,220,.25)}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #D9488D}
.bigbtn.blue:active{box-shadow:0 2px 0 #3A8FD6}
.iconbtn{width:70px;height:70px;border-radius:50%;font-size:32px;background:#fff;box-shadow:0 5px 0 #F3A6CB;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center}
.iconbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #F3A6CB}
.pill{background:#fff;border-radius:999px;padding:10px 22px;font-size:24px;font-weight:bold;box-shadow:0 4px 0 #BFE3FF;white-space:nowrap}

/* ---------- menu ---------- */
#menu{flex-direction:column;align-items:center;background:linear-gradient(160deg,#FFD1E8 0%,#FFEFF7 45%,#CFEBFF 100%);padding:12px 16px 18px}
.floaties{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.floaties span{position:absolute;bottom:-60px;font-size:40px;opacity:.55;animation:floatUp linear infinite}
@keyframes floatUp{from{transform:translateY(0) rotate(-10deg)}to{transform:translateY(-120vh) rotate(15deg)}}
.menuTop{width:100%;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.title{margin:0;text-align:center;line-height:1;position:relative;z-index:1}
.title .t1{display:block;font-size:clamp(26px,4.6vmin,44px);color:var(--blue-d);text-shadow:0 3px 0 #fff}
.title .t2{display:block;font-size:clamp(44px,8.5vmin,84px);color:var(--pink-d);
  text-shadow:0 4px 0 #fff,0 8px 0 rgba(224,71,143,.2)}
.girls{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-end;gap:4vmin;position:relative;z-index:1;width:100%}
.girls svg{height:100%;max-width:42%}
.girls .g{height:100%;animation:bob 2.4s ease-in-out infinite}
.girls .g:nth-child(2){animation-delay:-1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:min(1000px,100%);position:relative;z-index:1}
.card{background:#fff;border-radius:30px;padding:16px 8px;box-shadow:0 8px 0 #FFB3D6,0 12px 24px rgba(200,60,140,.18);
  display:flex;flex-direction:column;align-items:center;gap:6px;border:5px solid #FFD1E8}
.card.blue{box-shadow:0 8px 0 #A8DDFF,0 12px 24px rgba(60,140,220,.18);border-color:#CFEBFF}
.card:active{transform:translateY(5px);box-shadow:0 3px 0 #FFB3D6}
.card .cicon{font-size:clamp(48px,9vmin,80px);line-height:1.1}
.card .cname{font-size:clamp(20px,3.4vmin,30px);font-weight:bold;color:var(--pink-d)}
.card.blue .cname{color:var(--blue-d)}

/* ---------- pinata ---------- */
#pinata{background:linear-gradient(#CDEBFF 0%,#EAF6FF 45%,#FFE3F1 80%,#FFCFE6 100%)}
#pcan{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:14px;pointer-events:none}
.hud > *{pointer-events:auto}
.hud .grow{flex:1;display:flex;justify-content:center}
.hpbar{width:min(360px,46vw);height:30px;background:#fff;border-radius:999px;padding:5px;box-shadow:0 4px 0 #FFB3D6}
#hpfill{height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#FF6FB5,#6EC1FF);transition:width .2s}
.hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#fff;border-radius:999px;padding:14px 28px;
  font-size:26px;font-weight:bold;color:var(--pink-d);box-shadow:0 5px 0 #FFB3D6;white-space:nowrap;pointer-events:none;
  animation:pulse 1.4s ease-in-out infinite;transition:opacity .3s}
.hint.hide{opacity:0}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}

/* ---------- designer ---------- */
#design{flex-direction:column;background:linear-gradient(160deg,#FFE1F0,#DDF1FF)}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 14px}
.topbar h2{flex:1;margin:0;font-size:clamp(26px,4.4vmin,40px);color:var(--pink-d);text-shadow:0 3px 0 #fff;text-align:center}
.dmain{flex:1;display:flex;min-height:0;gap:12px;padding:0 12px 12px}
#stage{flex:1;display:flex;justify-content:center;align-items:stretch;gap:8px;min-width:0;min-height:0;border-radius:28px;
  background:radial-gradient(ellipse at 50% 45%,#fff 0%,rgba(255,255,255,.6) 45%,rgba(255,255,255,0) 72%)}
.charWrap{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;max-width:440px;
  border-radius:26px;padding:6px;border:5px solid transparent}
#stage.both .charWrap.sel{border-color:var(--pink);background:rgba(255,255,255,.6)}
.charSvg{flex:1;min-height:0;width:100%;display:flex;justify-content:center}
.charSvg svg{width:100%;height:100%}
.nameTag{font-size:24px;font-weight:bold;background:#fff;padding:4px 20px;border-radius:999px;color:var(--pink-d);box-shadow:0 3px 0 #FFB3D6}
.charWrap[data-who=leah] .nameTag{color:var(--blue-d);box-shadow:0 3px 0 #A8DDFF}
.bubble{position:absolute;top:2%;left:50%;transform:translate(-50%,0) scale(0);background:#fff;border-radius:22px;padding:10px 18px;
  font-size:22px;font-weight:bold;color:var(--pink-d);box-shadow:0 4px 12px rgba(90,42,94,.18);white-space:nowrap;z-index:3;
  transition:transform .25s cubic-bezier(.3,1.6,.6,1);pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.show{transform:translate(-50%,0) scale(1)}
#panel{width:52%;display:flex;flex-direction:column;background:rgba(255,255,255,.75);border-radius:28px;padding:12px;min-height:0;gap:10px}
#cats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;flex-shrink:0;padding:2px 2px 6px}
.cat{flex:0 0 auto;min-width:96px;height:84px;border-radius:22px;background:#FFE6F2;font-size:34px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:4px 8px;box-shadow:0 4px 0 #FFC4E1}
.cat small{font-size:14px;font-weight:bold;white-space:nowrap}
.cat.on{background:var(--pink);color:#fff;box-shadow:0 4px 0 #D9488D}
#optTitle{font-size:24px;font-weight:bold;color:var(--blue-d);text-align:center;flex-shrink:0}
#opts{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:12px;align-content:start;padding:4px}
#opts.colours{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.chip{position:relative;background:#fff;border-radius:22px;border:5px solid #E3F2FF;padding:4px;display:flex;flex-direction:column;
  align-items:center;font-size:17px;font-weight:bold}
.chip svg{width:100%;height:112px}
.chip.on{border-color:#FF6FB5;background:#FFF0F8}
.chip.on::after{content:"✓";position:absolute;top:-8px;right:-8px;width:34px;height:34px;border-radius:50%;background:#FF6FB5;
  color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
.sw{aspect-ratio:1;width:100%;border-radius:50%;border:6px solid #fff;box-shadow:0 3px 8px rgba(90,42,94,.2)}
.sw.on{outline:6px solid #FF6FB5;outline-offset:2px}
.prow{display:flex;gap:12px;justify-content:center;flex-shrink:0;flex-wrap:wrap}
.prow .bigbtn{font-size:22px;padding:14px 22px}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(90,30,90,.42);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.cardbox{background:#fff;border-radius:34px;padding:26px 30px;text-align:center;max-width:820px;width:100%;
  box-shadow:0 10px 0 #FFB3D6,0 20px 40px rgba(90,30,90,.3);animation:popIn .35s cubic-bezier(.3,1.6,.6,1)}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.cardbox h2{margin:0 0 10px;font-size:44px;color:var(--pink-d)}
.cardbox p{font-size:26px;margin:0 0 20px}
.row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.whoRow{display:flex;gap:16px;justify-content:center;margin:10px 0 22px;flex-wrap:wrap}
.whoBtn{background:#FFF0F8;border-radius:28px;padding:10px 14px 14px;font-size:28px;font-weight:bold;color:var(--pink-d);
  border:5px solid #FFD1E8;box-shadow:0 6px 0 #FFB3D6;display:flex;flex-direction:column;align-items:center;min-width:180px}
.whoBtn.blue{background:#EEF8FF;color:var(--blue-d);border-color:#CFEBFF;box-shadow:0 6px 0 #A8DDFF}
.whoBtn:active{transform:translateY(4px)}
.whoPic{height:150px;display:flex;justify-content:center}
.whoPic svg{height:100%;width:140px}
.whoBtn[data-who=both] .whoPic svg{width:110px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

@media (orientation:portrait){
  .dmain{flex-direction:column}
  #panel{width:auto;height:50%}
  .cards{gap:14px}
}
@media (max-width:620px){
  .cards{grid-template-columns:1fr}
  .card{flex-direction:row;justify-content:center;gap:16px;padding:8px}
}
</style>
</head>
<body>
<div id="app">

  <!-- MENU -->
  <section id="menu" class="screen active">
    <div class="floaties" id="floaties"></div>
    <div class="menuTop">
      <div class="pill">🍬 Sweet jar: <b id="jarN">0</b></div>
      <button class="iconbtn" id="soundBtn" aria-label="Sound on or off">🔊</button>
    </div>
    <h1 class="title"><span class="t1">Belle and Leah's</span><span class="t2">Perfect Game</span></h1>
    <div class="girls" id="menuGirls"></div>
    <div class="cards">
      <button class="card" data-go="pinata"><div class="cicon">🎀</div><div class="cname">Bow Piñata</div></button>
      <button class="card blue" data-go="pj"><div class="cicon">👚</div><div class="cname">Pyjama Designer</div></button>
      <button class="card" data-go="hair"><div class="cicon">💇</div><div class="cname">Hair Salon</div></button>
    </div>
  </section>

  <!-- PINATA -->
  <section id="pinata" class="screen">
    <canvas id="pcan"></canvas>
    <div class="hud">
      <div class="pill" id="pJar">🍬 <b id="pGot">0</b></div>
      <div class="grow"><div class="hpbar"><div id="hpfill"></div></div></div>
      <button class="iconbtn pauseBtn" aria-label="Pause">⏸</button>
    </div>
    <div class="hint" id="pHint">Tap the bow to whack it! 🎀</div>
  </section>

  <!-- DESIGNER (pyjamas and hair) -->
  <section id="design" class="screen">
    <div class="topbar">
      <button class="iconbtn" data-home aria-label="Home">🏠</button>
      <button class="iconbtn" id="dWho" aria-label="Choose who">👭</button>
      <h2 id="dTitle">Pyjama Designer</h2>
      <button class="iconbtn pauseBtn" aria-label="Pause">⏸</button>
    </div>
    <div class="dmain">
      <div id="stage"></div>
      <div id="panel">
        <div id="cats"></div>
        <div id="optTitle"></div>
        <div id="opts"></div>
        <div class="prow">
          <button class="bigbtn blue" id="dRandom">🎲 Surprise me!</button>
          <button class="bigbtn" id="dDone">✨ All done!</button>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- who are we designing? -->
<div class="overlay" id="who">
  <div class="cardbox">
    <h2>Who are we designing?</h2>
    <div class="whoRow">
      <button class="whoBtn" data-who="belle"><div class="whoPic"></div>Belle</button>
      <button class="whoBtn blue" data-who="leah"><div class="whoPic"></div>Leah</button>
      <button class="whoBtn" data-who="both"><div class="whoPic"></div>Both!</button>
    </div>
    <button class="bigbtn blue" data-home>🏠 Home</button>
  </div>
</div>

<!-- pinata finished -->
<div class="overlay" id="pDone">
  <div class="cardbox">
    <h2>Yummy! 😋</h2>
    <p id="pDoneTxt"></p>
    <div class="row">
      <button class="bigbtn" id="pAgain">🎀 Another piñata!</button>
      <button class="bigbtn blue" data-home>🏠 Home</button>
    </div>
  </div>
</div>

<!-- pause -->
<div class="overlay" id="pause">
  <div class="cardbox">
    <h2>Paused ⏸</h2>
    <p>Have a little rest! 💤</p>
    <div class="row">
      <button class="bigbtn" id="resumeBtn">▶ Carry on</button>
      <button class="bigbtn blue" data-home>🏠 Home</button>
    </div>
  </div>
</div>

<canvas id="fx"></canvas>

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const has = (arr, k) => arr.indexOf(k) >= 0;
const NAMES = { belle: 'Belle', leah: 'Leah' };

/* =========================================================
   Saved things (sweets collected, how the girls look)
   ========================================================= */
function defaultChar(w) {
  const b = w === 'belle';
  return {
    who: w,
    pj: { top: 'long', bottoms: 'long', colour: b ? '#FF8CC6' : '#6EC1FF', bcolour: b ? '#6EC1FF' : '#FF8CC6',
          pattern: b ? 'hearts' : 'stars', pcolour: '#FFFFFF', slippers: b ? 'bunny' : 'fluffy', extras: [] },
    hair: { style: b ? 'long' : 'ponytail', fringe: b ? 'straight' : 'side', colour: b ? '#C69060' : '#3A2318',
            extras: ['bow'], acc: b ? '#FF4FA3' : '#4FA8F0' }
  };
}
const store = (function () {
  const d = { sweets: 0, pinatas: 0, muted: false, chars: { belle: defaultChar('belle'), leah: defaultChar('leah') } };
  let s = null;
  try { s = JSON.parse(localStorage.getItem('perfectGame') || 'null'); } catch (e) {}
  if (!s) return d;
  const chars = s.chars || {};
  ['belle', 'leah'].forEach(w => {
    const dc = defaultChar(w), sc = chars[w] || {};
    d.chars[w] = { who: w, pj: Object.assign(dc.pj, sc.pj || {}), hair: Object.assign(dc.hair, sc.hair || {}) };
  });
  d.sweets = s.sweets || 0; d.pinatas = s.pinatas || 0; d.muted = !!s.muted;
  return d;
})();
function save() { try { localStorage.setItem('perfectGame', JSON.stringify(store)); } catch (e) {} }

/* =========================================================
   Sounds, all made in code
   ========================================================= */
let AC = null, master = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.6; master.connect(AC.destination);
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(o) {
  if (store.muted) return;
  const a = audio(); if (!a) return;
  const f = o.f || 440, t = o.t || 0.15, v = o.v || 0.3, now = a.currentTime + (o.delay || 0);
  const osc = a.createOscillator(), g = a.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(f, now);
  if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, now + t);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(v, now + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, now + t);
  osc.connect(g); g.connect(master); osc.start(now); osc.stop(now + t + 0.05);
}
let noiseBuf = null;
function noise(o) {
  if (store.muted) return;
  const a = audio(); if (!a) return;
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = o.t || 0.2, now = a.currentTime + (o.delay || 0);
  const src = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
  src.buffer = noiseBuf;
  fl.type = 'bandpass'; fl.frequency.value = o.freq || 1200; fl.Q.value = o.q || 1;
  g.gain.setValueAtTime(o.v || 0.3, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + t);
  src.connect(fl); fl.connect(g); g.connect(master);
  src.start(now, Math.random() * 0.5); src.stop(now + t + 0.05);
}
const SFX = {
  tap() { tone({ f: 620, f2: 900, t: 0.08, v: 0.15 }); },
  pop() { tone({ f: 300, f2: 1300, t: 0.09, v: 0.3 }); noise({ t: 0.05, v: 0.1, freq: 3200 }); },
  squish() { tone({ f: 240, f2: 90, t: 0.2, v: 0.35 }); noise({ t: 0.14, v: 0.14, freq: 500, q: 2 }); },
  bloop() { tone({ f: 380, f2: 760, t: 0.14, v: 0.25, type: 'triangle' }); },
  hit() { tone({ f: 170, f2: 50, t: 0.22, v: 0.65 }); noise({ t: 0.12, v: 0.4, freq: 900 }); this.squish(); },
  whoosh() { noise({ t: 0.25, v: 0.22, freq: 800, q: 0.7 }); },
  crack() { noise({ t: 0.5, v: 0.6, freq: 1500, q: 0.5 }); tone({ f: 130, f2: 40, t: 0.45, v: 0.7 }); },
  snip() { noise({ t: 0.04, v: 0.35, freq: 5000, q: 3 }); noise({ t: 0.04, v: 0.35, freq: 5500, q: 3, delay: 0.09 }); },
  sparkle() { [0, 1, 2, 3].forEach(i => tone({ f: 880 * Math.pow(1.26, i), t: 0.25, v: 0.12, delay: i * 0.06, type: 'triangle' })); },
  yay() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone({ f, t: 0.35, v: 0.2, delay: i * 0.1, type: 'triangle' })); },
  collect(n) { const k = n % 12; tone({ f: 500 + k * 55, f2: 950 + k * 55, t: 0.1, v: 0.25 }); }
};

/* =========================================================
   Confetti and hearts (shared by every game)
   ========================================================= */
const fxc = $('#fx'), fctx = fxc.getContext('2d');
const parts = [];
const CONF = ['#FF8CC6', '#FF4FA3', '#FFC4E1', '#6EC1FF', '#3A8FD6', '#BDE6FF', '#FFFFFF'];
function sizeFx() {
  const d = Math.min(2, window.devicePixelRatio || 1);
  fxc.width = Math.round(innerWidth * d); fxc.height = Math.round(innerHeight * d);
  fctx.setTransform(d, 0, 0, d, 0, 0);
}
function confetti(x, y, n) {
  for (let i = 0; i < (n || 80); i++) {
    const a = rand(0, Math.PI * 2), sp = rand(150, 650);
    parts.push({ k: 'c', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 250, r: rand(0, 6), vr: rand(-10, 10),
                 w: rand(8, 14), h: rand(5, 9), c: pick(CONF), life: rand(1.6, 2.6) });
  }
}
function rainConfetti(n) { for (let i = 0; i < n; i++) confetti(rand(0, innerWidth), -20, 1); }
function hearts(x, y, n) {
  for (let i = 0; i < (n || 10); i++)
    parts.push({ k: 'h', x: x + rand(-40, 40), y: y + rand(-20, 20), vx: rand(-40, 40), vy: rand(-180, -90),
                 s: rand(12, 24), c: pick(['#FF6FB5', '#FF8CC6', '#6EC1FF', '#FF4FA3']), life: rand(1.4, 2.2), ph: rand(0, 6) });
}
function heartPath(c, x, y, s) {
  c.beginPath(); c.moveTo(x, y + s * 0.6);
  c.bezierCurveTo(x - s * 1.2, y - s * 0.2, x - s * 0.5, y - s * 0.95, x, y - s * 0.3);
  c.bezierCurveTo(x + s * 0.5, y - s * 0.95, x + s * 1.2, y - s * 0.2, x, y + s * 0.6);
}
function fxStep(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    if (p.k === 'c') { p.vy += 700 * dt; p.vx *= Math.exp(-1.5 * dt); p.vy *= Math.exp(-1.2 * dt); p.r += p.vr * dt; }
    else { p.ph += dt * 4; p.vx = Math.sin(p.ph) * 40; }

/* =========================================================
   Moving between screens, pausing
   ========================================================= */
let screen = 'menu', paused = false, lastInput = performance.now();
function show(id) {
  screen = id;
  $$('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  $$('.overlay').forEach(o => o.classList.remove('show'));
  paused = false;
}
function goHome() { SFX.tap(); show('menu'); renderMenu(); }
function pause() {
  if (screen === 'menu' || paused) return;
  paused = true; $('#pause').classList.add('show');
}
function resume() { paused = false; $('#pause').classList.remove('show'); lastInput = performance.now(); SFX.tap(); }
$$('[data-home]').forEach(b => b.addEventListener('click', goHome));
$$('.pauseBtn').forEach(b => b.addEventListener('click', () => { SFX.tap(); pause(); }));
$('#resumeBtn').addEventListener('click', resume);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('pointerdown', () => { lastInput = performance.now(); audio(); }, true);
setInterval(() => { if (performance.now() - lastInput > 60000) pause(); }, 2000);

      opts: [['long', 'Long sleeves'], ['tee', 'T-shirt'], ['vest', 'Strappy'], ['nightie', 'Nightie']] },
    { icon: '🎨', name: 'Top colour', kind: 'colour', path: 'pj.colour', opts: PJ_COL },
    { icon: '👖', name: 'Bottoms', kind: 'choice', path: 'pj.bottoms', view: '40 236 120 150',
      opts: [['long', 'Long'], ['cropped', 'Cropped'], ['shorts', 'Shorts'], ['frilly', 'Frilly shorts']] },
    { icon: '🩵', name: 'Bottoms colour', kind: 'colour', path: 'pj.bcolour', opts: PJ_COL },
    { icon: '⭐', name: 'Pattern', kind: 'choice', path: 'pj.pattern', view: '50 150 100 100',
      opts: [['plain', 'Plain'], ['hearts', 'Hearts'], ['stars', 'Stars'], ['spots', 'Spots'], ['stripes', 'Stripes'], ['clouds', 'Clouds'], ['moons', 'Moons'], ['checks', 'Checks']] },
    { icon: '🖍️', name: 'Pattern colour', kind: 'colour', path: 'pj.pcolour', opts: PJ_COL },
    { icon: '🥿', name: 'Slippers', kind: 'choice', path: 'pj.slippers', view: '55 338 90 52',
      opts: [['none', 'Bare feet'], ['fluffy', 'Fluffy'], ['bunny', 'Bunny'], ['unicorn', 'Unicorn'], ['bear', 'Teddy bear']] },
    { icon: '🧸', name: 'Extras', kind: 'toggle', path: 'pj.extras', view: '5 10 190 290',
      opts: [['teddy', 'Teddy'], ['cocoa', 'Hot chocolate'], ['mask', 'Sleep mask'], ['cap', 'Night cap'], ['bow', 'Bow'], ['pocket', 'Heart pocket']] }
  ],
  hair: [
    { icon: '💇', name: 'Hairstyle', kind: 'choice', path: 'hair.style', view: '10 0 180 250',
      opts: [['long', 'Long'], ['ponytail', 'Ponytail'], ['bunches', 'Bunches'], ['plaits', 'Plaits'], ['bun', 'Bun'], ['spacebuns', 'Space buns'], ['curly', 'Curly'], ['bob', 'Bob']] },
    { icon: '✂️', name: 'Fringe', kind: 'choice', path: 'hair.fringe', view: '35 22 130 112',
      opts: [['none', 'No fringe'], ['straight', 'Straight'], ['side', 'Side swept']] },
    { icon: '🎨', name: 'Hair colour', kind: 'colour', path: 'hair.colour', opts: HAIR_COL },
    { icon: '🎀', name: 'Accessories', kind: 'toggle', path: 'hair.extras', view: '15 0 170 170',
      opts: [['bow', 'Big bow'], ['clips', 'Star clips'], ['headband', 'Headband'], ['crown', 'Tiara'], ['flowers', 'Flower crown'], ['glitter', 'Glitter']] },
    { icon: '💗', name: 'Accessory colour', kind: 'colour', path: 'hair.acc', opts: ACC_COL }
  ]
};
const PRAISE = {
  pj: ['Ooh, so cosy!', 'I love it!', 'So comfy!', 'Perfect for bedtime!', 'Pyjama party! 🎉', 'So cute!'],
  hair: ['Gorgeous!', 'I love my hair!', 'So pretty!', 'Fabulous! ✨', 'Snip snip!', 'Looking perfect!']
};
const D = { mode: 'pj', who: 'belle', sel: 'belle', cat: 0, changes: 0, list: [] };
function getP(o, path) { return path.split('.').reduce((a, k) => a[k], o); }
function setP(o, path, v) { const ks = path.split('.'); const last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; }
function clone(o) { return JSON.parse(JSON.stringify(o)); }

function openWho(mode) {
  D.mode = mode;
  const v = '20 0 160 165';
  $('[data-who=belle] .whoPic').innerHTML = charSVG(store.chars.belle, v);
  $('[data-who=leah] .whoPic').innerHTML = charSVG(store.chars.leah, v);
  $('[data-who=both] .whoPic').innerHTML = charSVG(store.chars.belle, v) + charSVG(store.chars.leah, v);
  $('#who').classList.add('show');
}
$$('.whoBtn').forEach(b => b.addEventListener('click', () => {
  SFX.pop();
  const w = b.getAttribute('data-who');
  D.who = w; D.sel = w === 'both' ? 'belle' : w; D.cat = 0;
  show('design'); renderDesign();
}));
$('#dWho').addEventListener('click', () => { SFX.tap(); openWho(D.mode); });

function stageView() { return D.mode === 'hair' ? '10 0 180 260' : '0 5 200 395'; }
function renderDesign() {
  $('#dTitle').textContent = D.mode === 'pj' ? 'Pyjama Designer 👚' : 'Hair Salon 💇';
  D.list = D.who === 'both' ? ['belle', 'leah'] : [D.who];
  const st = $('#stage');
  st.classList.toggle('both', D.who === 'both');
  st.innerHTML = D.list.map(w => `<div class="charWrap" data-who="${w}"><div class="bubble"></div><div class="charSvg"></div><div class="nameTag">${NAMES[w]}</div></div>`).join('');
  $$('.charWrap').forEach(cw => cw.addEventListener('click', () => {
    const w = cw.getAttribute('data-who');
    if (D.who !== 'both' || D.sel === w) return;
    D.sel = w; SFX.bloop(); markSel(); renderOpts();
    say(w, w === 'belle' ? "My turn!" : "Now me!");
  }));
  markSel(); drawChars(); renderCats(); renderOpts();
}
function markSel() { $$('.charWrap').forEach(cw => cw.classList.toggle('sel', cw.getAttribute('data-who') === D.sel)); }
function drawChars() {
  $$('.charWrap').forEach(cw => { cw.querySelector('.charSvg').innerHTML = charSVG(store.chars[cw.getAttribute('data-who')], stageView(), D.mode === 'hair'); });
}
function renderCats() {
  const cats = CATS[D.mode];
  $('#cats').innerHTML = cats.map((c, i) => `<button class="cat${i === D.cat ? ' on' : ''}" data-i="${i}">${c.icon}<small>${c.name}</small></button>`).join('');
  $$('.cat').forEach(b => b.addEventListener('click', () => { D.cat = +b.getAttribute('data-i'); SFX.tap(); renderCats(); renderOpts(); }));
}
function renderOpts() {
  const cat = CATS[D.mode][D.cat], ch = store.chars[D.sel], box = $('#opts');
  $('#optTitle').textContent = cat.name + (D.who === 'both' ? ` for ${NAMES[D.sel]}` : '');
  box.className = cat.kind === 'colour' ? 'colours' : '';
  const cur = getP(ch, cat.path);
  if (cat.kind === 'colour') {
    box.innerHTML = cat.opts.map(col => {
      const bg = col === 'ombre' ? 'linear-gradient(#FF9AD0,#86C9FF)' : col;
      return `<button class="sw${col === cur ? ' on' : ''}" data-v="${col}" style="background:${bg}" aria-label="colour"></button>`;
    }).join('');
  } else {
    box.innerHTML = cat.opts.map(o => {
      const pv = clone(ch);
      if (cat.kind === 'choice') setP(pv, cat.path, o[0]);
      else { const arr = getP(pv, cat.path); if (!has(arr, o[0])) arr.push(o[0]); }
      if (cat.path === 'pj.bottoms' && pv.pj.top === 'nightie') pv.pj.top = 'tee';
      const on = cat.kind === 'choice' ? cur === o[0] : has(cur, o[0]);
      return `<button class="chip${on ? ' on' : ''}" data-v="${o[0]}">${charSVG(pv, cat.view, D.mode === 'hair')}<span>${o[1]}</span></button>`;
    }).join('');
  }
  $$('#opts button').forEach(b => b.addEventListener('click', () => choose(cat, b.getAttribute('data-v'))));
}
function choose(cat, v) {
  const ch = store.chars[D.sel];
  if (cat.kind === 'toggle') {
    const arr = getP(ch, cat.path), i = arr.indexOf(v);
    if (i >= 0) { arr.splice(i, 1); SFX.tap(); } else { arr.push(v); SFX.sparkle(); }
  } else {
    setP(ch, cat.path, v);
    if (cat.path === 'pj.bottoms' && ch.pj.top === 'nightie') ch.pj.top = 'long';
    if (cat.kind === 'colour') SFX.squish();
    else if (D.mode === 'hair' && cat.path === 'hair.style') SFX.snip();
    else SFX.pop();
  }
  save(); drawChars(); renderOpts();
  D.changes++;
  if (D.changes % 3 === 0) say(D.sel, pick(PRAISE[D.mode]));
}
const bubbleTimers = {};
function say(who, text) {
  const cw = $(`.charWrap[data-who=${who}]`); if (!cw) return;
  const b = cw.querySelector('.bubble');
  b.textContent = text; b.classList.add('show');
  clearTimeout(bubbleTimers[who]);
  bubbleTimers[who] = setTimeout(() => b.classList.remove('show'), 1800);
}
function surprise() {
  const ch = store.chars[D.sel];
  CATS[D.mode].forEach(cat => {
    if (cat.kind === 'colour') setP(ch, cat.path, pick(cat.opts));
    else if (cat.kind === 'choice') setP(ch, cat.path, pick(cat.opts)[0]);
    else setP(ch, cat.path, cat.opts.filter(() => Math.random() < 0.3).map(o => o[0]));
  });
  save(); drawChars(); renderOpts(); SFX.sparkle();
  const r = $(`.charWrap[data-who=${D.sel}]`).getBoundingClientRect();
  confetti(r.left + r.width / 2, r.top + r.height * 0.4, 50);
  say(D.sel, pick(['Ta-da!', 'Surprise!', 'Wow!', 'Ooh!']));
}
$('#dRandom').addEventListener('click', surprise);
$('#dDone').addEventListener('click', () => {
  SFX.yay(); rainConfetti(140);
  $$('.charWrap').forEach(cw => { const r = cw.getBoundingClientRect(); hearts(r.left + r.width / 2, r.top + r.height * 0.5, 12); });
  if (D.who === 'both') {
    say('belle', D.mode === 'pj' ? 'Pyjama party!' : 'We look perfect!');
    setTimeout(() => say('leah', D.mode === 'pj' ? 'Best night ever!' : 'Hair twins! 💕'), 500);
  } else say(D.who, D.mode === 'pj' ? 'I love my pyjamas!' : 'My hair is perfect!');
});

/* =========================================================
   The animation loop
   ========================================================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (!paused) { if (screen === 'pinata') pinataStep(dt); fxStep(dt); }
  if (screen === 'pinata') pinataDraw();
  fxDraw();
  requestAnimationFrame(frame);
}
window.addEventListener('resize', () => { sizeFx(); if (screen === 'pinata') sizeP(); });
sizeFx(); renderMenu(); requestAnimationFrame(frame);
</script>
</body>
